[project]
name = "my-own-fusion"
version = "0.1.0"
description = "A standalone Proof-of-Concept of the OpenRouter Fusion multi-model deliberation pipeline."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "WTFPL" }
authors = [{ name = "ssig33" }]
keywords = ["llm", "openrouter", "fusion", "ensemble", "multi-model"]
dependencies = ["httpx>=0.27"]

[project.scripts]
myfusion = "myfusion.cli:main"

[project.urls]
Homepage = "https://github.com/ssig33/my-own-fusion"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/myfusion"]

[dependency-groups]
dev = ["pytest>=8"]
